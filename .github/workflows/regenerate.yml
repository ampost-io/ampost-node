# Once a day: regenerate from the live https://api.ampost.io/openapi.json and open a pull request
# when the API changed. Needs the repo setting "Allow GitHub Actions to create pull requests".
name: Regenerate from OpenAPI

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate -- --spec https://api.ampost.io/openapi.json
      - run: npm run typecheck && npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: regenerate-openapi
          commit-message: "chore: regenerate from openapi.json"
          title: "Regenerate from the current Ampost OpenAPI document"
          body: "Generated by the daily Regenerate from OpenAPI workflow. Bump the version in package.json and src/version.ts before publishing."
